<script type="text/babel">
const {TeachBackBox,TopicChip}=window.TeachbackDesignSystem_417209;
function Demo(){
  const [v,setV]=React.useState('');
  const [sel,setSel]=React.useState('B008');
  return <>
    <div className="row">
      <TopicChip id="B008" title="SIPC" state="Rusty" selected={sel==='B008'} onClick={()=>setSel('B008')}/>
      <TopicChip id="B010" title="Investors" state="Exam-Ready" selected={sel==='B010'} onClick={()=>setSel('B010')}/>

    <TeachBackBox value={v} onChange={setV} rows={4}
      prompt="In your own words, explain SIPC vs FDIC—what each protects, the coverage limits, and the important exclusions."
      placeholder="Start with the institution each one protects…"/>
  </>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
