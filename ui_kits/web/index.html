<!DOCTYPE html><html><head><meta charset="utf-8"><title>teachback — web app</title>
<link rel="stylesheet" href="../../styles.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css">
<style>
body{margin:0;background:var(--surface-page);font-family:var(--font-body)}
a{color:var(--color-primary)}a:hover{color:var(--color-primary-hover)}
.tb-shell{min-height:100vh;background:var(--surface-page)}
.tb-body{display:grid;grid-template-columns:188px minmax(0,1fr);max-width:1280px;margin:0 auto;width:100%}
.tb-nav{padding:12px 12px 48px;display:grid;gap:8px;align-content:start;border-right:1px solid var(--border)}
.tb-main{padding:22px var(--page-pad) 80px;min-width:0}
.tb-home,.tb-cal{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(260px,.75fr);gap:22px;align-items:start}
.tb-flow{max-width:1100px;margin:0 auto;width:100%}
.tb-note{max-width:760px;margin:0 auto;display:grid;gap:16px}
.tb-teach{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(280px,.9fr);gap:22px;align-items:start}
@keyframes tb-pop{0%{transform:scale(.96);opacity:.4}100%{transform:scale(1);opacity:1}}
.tb-pop{animation:tb-pop var(--dur-pop) var(--ease-pop)}
.tb-field{width:100%;box-sizing:border-box;padding:12px 14px;border:1px solid var(--border-strong);border-radius:var(--radius-md);font:500 15px var(--font-body);background:var(--paper);color:var(--text-body)}
.tb-field:focus{outline:none;border-color:var(--clover-500);box-shadow:0 2px 0 var(--clover-700)}
@media (max-width:900px){
  .tb-body{grid-template-columns:1fr}
  .tb-nav{grid-auto-flow:column;justify-content:start;overflow-x:auto;border-right:0;border-bottom:1px solid var(--border);padding:10px var(--page-pad)}
  .tb-home,.tb-cal,.tb-teach{grid-template-columns:1fr}
}
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script src="./data.js"></script>
</head><body><div id="root"></div>
<script type="text/babel" src="./screens.jsx"></script>
<script type="text/babel">ReactDOM.createRoot(document.getElementById('root')).render(<window.TBWebApp/>);</script>
</body></html>
