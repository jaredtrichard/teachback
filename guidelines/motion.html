<!-- @dsCard group="Foundations" viewport="700x150" name="Motion" subtitle="Composed result pops, 80ms presses — no slow fades" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:22px;background:var(--surface-page);font-family:var(--font-body);color:var(--text-body);display:flex;gap:24px;align-items:center}
@keyframes pop{0%{transform:scale(.4)}100%{transform:scale(1)}}
@keyframes fill{0%{width:8%}100%{width:78%}}
.badge{padding:10px 18px;border-radius:var(--radius-pill);background:var(--state-examready-bg);color:var(--state-examready);font:700 14px var(--font-body);animation:pop var(--dur-pop) var(--ease-pop) infinite alternate}
.track{flex:1;height:16px;border-radius:var(--radius-pill);background:var(--tint);border:1px solid var(--border);overflow:hidden}
.fillb{height:100%;border-radius:var(--radius-pill);background:var(--clover-500);animation:fill 1.6s var(--ease-out) infinite alternate}
.meta{font:500 10px var(--font-mono);color:var(--text-faint)}a{color:var(--color-primary)}a:hover{color:var(--color-primary-hover)}</style></head><body>
<span class="badge">Exam-Ready!</span>
<div class="track"><div class="fillb"></div></div>
<span class="meta">pop .18s (.3,1.18,.45,1) · press .08s</span>
</body></html>
