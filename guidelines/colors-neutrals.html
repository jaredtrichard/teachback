<!-- @dsCard group="Colors" viewport="700x150" name="Neutrals & surfaces" subtitle="Warm cream shell, white cards, green-tinted ink" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px;background:var(--surface-page);font-family:var(--font-body)}
.row{display:flex;gap:10px}.sw{flex:1;height:78px;border-radius:var(--radius-md);border:1px solid var(--border);display:flex;align-items:flex-end;padding:8px 10px;font:700 12px var(--font-body);color:var(--text-body)}
.sw small{display:block;font:500 10px var(--font-mono);color:var(--text-faint)}a{color:var(--color-primary)}a:hover{color:var(--color-primary-hover)}</style></head><body>
<div class="row">
<div class="sw" style="background:var(--cream)">cream<small>#FAF8F2</small></div>
<div class="sw" style="background:var(--paper)">paper<small>#FFFFFF</small></div>
<div class="sw" style="background:var(--tint)">tint<small>#F1EEE6</small></div>
<div class="sw" style="background:var(--border)">border<small>#E3DFD4</small></div>
<div class="sw" style="background:var(--ink-muted);color:#fff">ink-muted<small style="color:#ffffffaa">#5A665D</small></div>
<div class="sw" style="background:var(--ink);color:#fff">ink<small style="color:#ffffffaa">#1E2822</small></div>
</div></body></html>
