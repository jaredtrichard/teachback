<!-- @dsCard group="Colors" viewport="700x150" name="Core palette" subtitle="Clover leads; tangerine energizes; grape is reserved for Mastered" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px;background:var(--surface-page);font-family:var(--font-body)}
.row{display:flex;gap:10px}.sw{flex:1;height:78px;border-radius:var(--radius-md);border:2px solid rgba(0,0,0,.08);box-shadow:0 3px 0 rgba(0,0,0,.15);display:flex;align-items:flex-end;padding:8px 10px;color:#fff;font:800 12px var(--font-body)}
.sw small{display:block;font:500 10px var(--font-mono);opacity:.85}a{color:var(--color-primary)}a:hover{color:var(--color-primary-hover)}</style></head><body>
<div class="row">
<div class="sw" style="background:var(--clover-500)">clover<small>#37B24D</small></div>
<div class="sw" style="background:var(--tangerine-500)">tangerine<small>#FA8A3B</small></div>
<div class="sw" style="background:var(--splash-500)">splash<small>#38A8E8</small></div>
<div class="sw" style="background:var(--sunny-500);color:#6B5200">sunny<small>#FFC13B</small></div>
<div class="sw" style="background:var(--grape-500)">grape<small>#9B6BE0</small></div>
<div class="sw" style="background:var(--coral-500)">coral<small>#F0705A</small></div>
</div></body></html>
