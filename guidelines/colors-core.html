<!-- @dsCard group="Colors" viewport="700x150" name="Core palette" subtitle="Desaturated clover leads; teal is reserved for Mastered" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px;background:var(--surface-page);font-family:var(--font-body)}
.row{display:flex;gap:10px}.sw{flex:1;height:78px;border-radius:var(--radius-md);border:1px solid rgba(0,0,0,.08);box-shadow:0 2px 0 rgba(0,0,0,.15);display:flex;align-items:flex-end;padding:8px 10px;color:#fff;font:700 12px var(--font-body)}
.sw small{display:block;font:500 10px var(--font-mono);opacity:.85}a{color:var(--color-primary)}a:hover{color:var(--color-primary-hover)}</style></head><body>
<div class="row">
<div class="sw" style="background:var(--clover-500)">clover<small>#2F8F5B</small></div>
<div class="sw" style="background:var(--tangerine-500)">tangerine<small>#CE8449</small></div>
<div class="sw" style="background:var(--splash-500)">splash<small>#4E8CB8</small></div>
<div class="sw" style="background:var(--sunny-500);color:#6B5200">sunny<small>#CDA344</small></div>
<div class="sw" style="background:var(--teal-500)">teal<small>#2E7E8C</small></div>
<div class="sw" style="background:var(--coral-500)">coral<small>#CE6B57</small></div>
</div></body></html>
